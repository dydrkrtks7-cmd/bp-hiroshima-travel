        h1 {

        .hero {
            position: relative;

            overflow: hidden;
            text-align: center;
            /* 배겨ᄝ 질감/색상 강조 */
            background: linear-gradient(135deg, var(--color-primary) 0%, rgba(255, 59, 0, 0.2) 40%, #111111 100%);
        }

        /* 히어로 요소 비대칭 배치 예ᄉ시 */
        .hero::before {
            content: '';
            position: absolute;
            top: -50px; /* 위로 치우침 */
            right: -40px; /* 오른쪽으로 벗어남 */
            width: 150px;
            height: 150px;
            background-color: var(--color-accent);
            border: 4px solid var(--color-primary);
            transform: rotate(-20deg); /* 기울임 */
        }

        }

        .review-grid {
