<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2137"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="942" cy="349" r="51" fill="#0a1628" opacity="0.15"/>
    <circle cx="873" cy="638" r="63" fill="#0a1628" opacity="0.12"/>
    <circle cx="22" cy="603" r="56" fill="#0a1628" opacity="0.19"/>
    <circle cx="-66" cy="705" r="75" fill="#0a1628" opacity="0.15"/>
    <circle cx="825" cy="592" r="55" fill="#0a1628" opacity="0.15"/>
    <circle cx="-2" cy="189" r="93" fill="#0a1628" opacity="0.07"/>
    <rect x="1143" y="650" width="25" height="59" rx="8" fill="#0d2137" opacity="0.05" transform="rotate(43, 160, 517)"/>
    <rect x="1103" y="721" width="79" height="41" rx="8" fill="#0d2137" opacity="0.10" transform="rotate(40, 972, -94)"/>
    <rect x="573" y="584" width="30" height="94" rx="8" fill="#0d2137" opacity="0.14" transform="rotate(2, 676, 725)"/>
    <rect x="1144" y="34" width="41" height="40" rx="8" fill="#0d2137" opacity="0.05" transform="rotate(34, 1093, -90)"/>
    <rect x="1260" y="409" width="31" height="86" rx="8" fill="#0d2137" opacity="0.13" transform="rotate(26, 699, 206)"/>
    <rect x="1222" y="52" width="22" height="64" rx="8" fill="#0d2137" opacity="0.13" transform="rotate(24, 1049, 259)"/>
    <rect x="785" y="22" width="47" height="35" rx="8" fill="#0d2137" opacity="0.09" transform="rotate(24, 743, 249)"/>
    <rect x="347" y="110" width="38" height="42" rx="8" fill="#0d2137" opacity="0.12" transform="rotate(39, -15, 170)"/>
    <polygon points="631,383 727,575 535,575" fill="#0a1628" opacity="0.11"/>
    <polygon points="-84,573 -6,729 -162,729" fill="#0a1628" opacity="0.09"/>
    <polygon points="1042,-18 1111,120 973,120" fill="#0a1628" opacity="0.12"/>
    <polygon points="319,-46 358,32 280,32" fill="#0a1628" opacity="0.04"/>

  <!-- Wave at bottom -->
  <path d="M0,544 C360,587 840,501 1200,544 L1200,630 L0,630Z" fill="#0a1628" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    Hiroshima travel 안내
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    Hiroshima — 정보
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#00bcd4" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#00bcd4" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    Hiroshima Hiroshima travel 안내 — 정보
  </text>
</svg>